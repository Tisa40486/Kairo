services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=mabase
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password 
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      - PMA_HOST=mariadb
    ports:
      - "8080:80"
    depends_on:
      - mariadb
volumes:
  mariadb_data: